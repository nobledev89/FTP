name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prompts:seed --check
      - run: pnpm contracts:sync --check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Design review (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: design-review
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  database:
    name: Supabase schema, RLS, and queue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:start
      - run: pnpm db:lint

      - name: Generated database types are current
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts local-worker/src/db/database.types.ts

      - run: pnpm test:integration

      # The authenticated admin console needs both a browser and a database, so it runs here
      # rather than in the Playwright job, which has no Supabase stack.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:admin

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: admin-session
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - if: always()
        run: pnpm supabase:stop
